<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="icon" href="https://i.imgur.com/cOxZefb.png" type="image/png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            background: #0b0e14;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 16px 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .logo-text {
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, #f5a623, #f7c56e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        .main-content h1 {
            font-size: 120px;
            font-weight: 900;
            color: rgba(255,255,255,0.05);
            margin-bottom: 20px;
            letter-spacing: 10px;
        }
        .main-content h2 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .main-content p {
            color: rgba(255,255,255,0.5);
            font-size: 18px;
        }
        .main-content a {
            margin-top: 30px;
            color: #f5a623;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .main-content a:hover {
            color: #f7c56e;
        }
        .footer {
            padding: 12px 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer span {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        @media (max-width: 600px) {
            .main-content h1 { font-size: 72px; }
            .main-content h2 { font-size: 24px; }
            .header { padding: 12px 20px; }
            .logo-text { font-size: 24px; }
            .logo-icon { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-area">
            <img class="logo-icon" src="https://i.imgur.com/cOxZefb.png" alt="Bagel Client Logo" />
            <span class="logo-text">Bagel Client</span>
        </div>
    </header>
    <main class="main-content">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/">← Go Back Home</a>
    </main>
    <footer class="footer">
        <span>Not Affiliated With Mojang Studios</span>
    </footer>
</body>
</html>
